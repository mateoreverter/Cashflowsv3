name: Actualizar Precios y TIRs Data912

on:
  schedule:
    - cron: '0 14,18,20 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Clonar el repositorio
      uses: actions/checkout@v4

    - name: 2. Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Instalar librerías matemáticas
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. Ejecutar el script (Data912)
      run: python actualizar_datos.py

    - name: 5. Guardar el nuevo data.json en el repositorio
      run: |
        git config --global user.name 'GitHub Action Bot'
        git config --global user.email 'action@github.com'
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de precios de mercado" && git push)
